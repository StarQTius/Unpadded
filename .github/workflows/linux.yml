on:
  push:
    branches:
      - unstable-v2
jobs:
  build-devcontainer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container
          version: latest
      - uses: docker/build-push-action@v6
        with:
          context: .github/devcontainer
          file: .github/devcontainer/Dockerfile
          outputs: type=docker,name=devcontainer,dest=devcontainer.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/upload-artifact@v7
        with:
          name: devcontainer
          path: devcontainer.tar

  format:
    runs-on: ubuntu-latest
    needs: build-devcontainer
    steps:
      - uses: ./.github/composite/prepare-environment
      - run: docker compose run configure_clang
      - run: docker compose run clang_format

  check-with-clang:
    runs-on: ubuntu-latest
    needs: format
    steps:
      - uses: ./.github/composite/prepare-environment
      - run: docker compose run configure_clang
      - run: docker compose run check_full_clang

  check-with-gcc:
    runs-on: ubuntu-latest
    needs: format
    steps:
      - uses: ./.github/composite/prepare-environment
      - run: docker compose run configure_gcc
      - run: docker compose run check_full_gcc

  iwyu:
    runs-on: ubuntu-latest
    needs: check-with-clang
    steps:
      - uses: ./.github/composite/prepare-environment
      - run: docker compose run configure_clang
      - run: docker compose run iwyu

  lint:
    runs-on: ubuntu-latest
    needs: check-with-clang
    steps:
      - uses: ./.github/composite/prepare-environment
      - run: docker compose run configure_clang
      - run: docker compose run clang_tidy
