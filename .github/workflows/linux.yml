on:
  push:
    branches:
      - unstable-v2
jobs:
  build-devcontainer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container
          version: latest
      - uses: docker/build-push-action@v6
        with:
          context: .github/devcontainer
          file: .github/devcontainer/Dockerfile
          outputs: type=docker,name=devcontainer,dest=devcontainer.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/upload-artifact@v7
        with:
          name: devcontainer
          path: devcontainer.tar

  check-with-clang:
    runs-on: ubuntu-latest
    needs: build-devcontainer
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v5
        with:
          path: build_clang
          key: ${{ runner.os }}-check-with-clang
      - uses: docker/setup-compose-action@v2
        with:
          version: latest
      - uses: ./.github/composite/load-devcontainer
      - run: docker compose run configure_clang
      - run: docker compose run check_full_clang

  check-with-gcc:
    runs-on: ubuntu-latest
    needs: build-devcontainer
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v5
        with:
          path: build_gcc
          key: ${{ runner.os }}-check-with-gcc
      - uses: ./.github/composite/load-devcontainer
      - run: docker compose run configure_gcc
      - run: docker compose run check_full_gcc
