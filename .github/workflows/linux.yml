on:
  push:
    branches:
      - unstable-v2
jobs:
  build-devcontainer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container
      - run: |
          docker buildx build .github/devcontainer \
          --file ${{ github.workspace }}/.github/devcontainer/Dockerfile \
          --output type=docker,dest=devcontainer.tar \
          --cache-from type=gha,scope=devcontainer \
          --cache-to type=gha,mode=max,scope=devcontainer \
          --progress plain
      - uses: actions/upload-artifact@v7
        with:
          name: devcontainer
          path: devcontainer.tar

  check-with-clang:
    runs-on: ubuntu-latest
    needs: build-devcontainer
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v5
        with:
          path: build
          key: ${{ runner.os }}-check-with-clang
      - uses: actions/download-artifact@v8
        with:
          name: devcontainer
      - run: docker load --input devcontainer.tar
      - run: docker run devcontainer cmake --preset clang
      - run: |
          docker run devcontainer cmake \
          --build build_clang \
          --target check_full \
          --parallel $(nproc)
