name: build-devcontainer
run-name: Build development container
on:
  push:
    branches:
      - unstable-v2
jobs:
  build-devcontainer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - run: |
          docker buildx build ${{ github.workspace }}/.github/devcontainer \
          --output type=docker,dest=devcontainer.tar \
          --cache-from type=gha \
          --cache-to type=gha,mode=max
      - uses: actions/upload-artifact@v7
        with:
          name: devcontainer
          path: devcontainer.tar
