name: CI/CD pipeline
on:
  push:
    branches:
      - unstable-v2
jobs:
  all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: actions/cache@v5
        with:
          path: docker_cache
          key: ${{ runner.os }}_docker_cache
      - run: |
          docker buildx build ${{ github.workspace }}/.github/devcontainer --tag devcontainer \
          --cache-from type=local,src=docker_cache \
          --cache-to type=local,dest=docker_cache
      - run: docker save devcontainer:latest --output devcontainer.tar 
      - uses: actions/upload-artifact@v7
        with:
          name: devcontainer
          path: devcontainer.tar
